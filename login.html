<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Banking Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #0b1f3a, #176b87);
			color: #17243a;
		}
		.login-card {
			width: min(92%, 420px);
			padding: 36px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 18px 45px rgba(0, 0, 0, .2);
		}
		.brand { margin: 0 0 8px; color: #176b87; font-size: 1.8rem; }
		.subtitle { margin: 0 0 28px; color: #687386; }
		label { display: block; margin: 16px 0 7px; font-weight: 600; }
		input {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid #ccd3dc;
			border-radius: 8px;
			font-size: 1rem;
		}
		input:focus { outline: 2px solid #42a5c5; border-color: transparent; }
		.options { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 24px; font-size: .9rem; }
		.remember { display: flex; align-items: center; gap: 7px; }
		.remember input { width: auto; }
		a { color: #176b87; text-decoration: none; font-weight: 600; }
		button {
			width: 100%;
			padding: 14px;
			border: 0;
			border-radius: 8px;
			background: #176b87;
			color: #fff;
			font-size: 1rem;
			font-weight: 700;
			cursor: pointer;
		}
		button:hover { background: #0f536a; }
		.signup { margin: 24px 0 0; text-align: center; color: #687386; font-size: .9rem; }
	</style>
</head>
<body>
	<main class="login-card">
		<h1 class="brand">SecureBank</h1>
		<p class="subtitle">Sign in to access your account</p>
		<form action="#" method="post">
			<label for="email">Email address</label>
			<input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

			<label for="password">Password</label>
			<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>

			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>
			<button type="submit">Sign in</button>
		</form>
		<p class="signup">Don't have an account? <a href="#register">Create one</a></p>
	</main>
</body>
</html>
